<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Registration Form</h1>
    <form>
        Username:<input type="text" name="username" placeholder="Enter a username:" ><br><br>
        Email:<input type="email" name="email" placeholder="Enter your email:" ><br><br>
        Password:<input type="password" name="password" placeholder="Enter a password:" ><br><br>
        Confirm Password:<input type="password" name="confirm_password" placeholder="Confirm your password:" ><br><br>
        <input type="submit" value="Register">
    </form>
</body>
</html>
